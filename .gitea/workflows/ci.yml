# speech2text CI/CD — Gitea Actions (air-gapped)
# Runs on the Act Runner (tucgitrunp01, CT 128)
#
# No external actions — the runner has no internet access.
# Uses git clone + system Python.
#
# Triggers:
#   - Push to any branch: lint + test (fast feedback)
#   - Push to main (merge): lint + test + deploy to tucspeechp01
#
# Required Gitea Actions secrets (repo Settings → Secrets):
#   DEPLOY_SSH_KEY  — SSH private key for jaxon@tucspeechp01.intra.leivo
#   DEPLOY_HOST     — 192.168.8.126 (tucspeechp01)

name: CI/CD

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose environment
        run: |
          echo "=== Network ==="
          hostname
          ip addr show 2>/dev/null | grep "inet " || ifconfig 2>/dev/null | grep "inet "
          echo "=== DNS ==="
          cat /etc/resolv.conf 2>/dev/null
          getent hosts gitea.intra.leivo 2>&1 || echo "DNS: gitea.intra.leivo NOT RESOLVED"
          echo "=== Gitea reachable? ==="
          curl -sk --max-time 5 https://192.168.8.119/api/v1/version 2>&1 || echo "HTTPS to 192.168.8.119 FAILED"
          echo "=== Python ==="
          python3 --version
          pip3 --version 2>/dev/null || echo "no pip3"
          echo "=== Git ==="
          git --version

      - name: Checkout
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try hostname first, fall back to IP
          CLONE_URL="https://gitea.intra.leivo/fletcher/speech2text.git"
          if ! getent hosts gitea.intra.leivo >/dev/null 2>&1; then
            echo "DNS unavailable — using IP"
            CLONE_URL="https://192.168.8.119/fletcher/speech2text.git"
          fi
          # Authenticated clone (private repo)
          git -c http.sslVerify=false clone --depth 1 \
            --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GITEA_TOKEN}@${CLONE_URL#https://}" .
          echo "Cloned: $(git log --oneline -1)"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip --quiet
          # CPU-only torch (conftest mocks whisper/torch anyway)
          pip install torch --index-url https://download.pytorch.org/whl/cpu --quiet
          pip install -r requirements.txt --quiet
          pip install pylint --quiet

      - name: Pylint — handlers
        run: |
          pylint handlers/ --disable=R0801 --fail-under=8.0 || true

      - name: Pylint — src
        run: |
          pylint src/ --disable=R0801 --fail-under=8.0 || true

      - name: Run tests
        run: |
          python3 -m pytest tests/ -v --tb=short -x

  deploy:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to tucspeechp01
        run: |
          # Write deploy key from secrets
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            jaxon@${{ secrets.DEPLOY_HOST }} << 'DEPLOY_EOF'
          set -euo pipefail
          cd /srv/speech2text
          echo "=== Pulling latest from Gitea ==="
          sudo -u speech2text git pull origin main
          echo "=== Updating dependencies ==="
          sudo -u speech2text /srv/speech2text/.venv/bin/pip install -r requirements.txt --upgrade --quiet
          echo "=== Restarting service ==="
          sudo systemctl restart speech2text.service
          sleep 3
          echo "=== Verifying ==="
          systemctl is-active speech2text.service
          echo "=== Deploy complete ==="
          DEPLOY_EOF
